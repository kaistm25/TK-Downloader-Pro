name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 📦 Package Source
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Verify setup.py
        run: python -m py_compile setup.py

      - name: 📦 Create ZIP
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then VERSION="v1.2.0"; fi
          
          mkdir -p package
          cp setup.py package/
          cp requirements.txt package/
          cp README.md package/
          cp LICENSE package/
          cp .gitignore package/
          
          printf '@echo off\r\ntitle TK Downloader Pro\r\npython setup.py all\r\npause\r\n' > package/run.bat
          printf '#!/bin/bash\npython3 setup.py all\n' > package/run.sh
          chmod +x package/run.sh
          
          [ -f icon.ico ] && cp icon.ico package/ || true
          [ -f icon.png ] && cp icon.png package/ || true
          [ -f icon.svg ] && cp icon.svg package/ || true
          
          cd package
          zip -r "../TK-Downloader-$VERSION.zip" .
          cd ..
          
          ls -lh TK-Downloader-*.zip

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: TK-Downloader-*.zip

  release:
    name: 🎁 Create Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: source-package

      - name: 📁 List files
        run: ls -lh

      - name: 🎁 Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TK Downloader Pro ${{ github.ref_name }}"
          body: |
            ## 🎉 TK Downloader Pro ${{ github.ref_name }}

            برنامج تحميل شامل يدعم 25+ منصة.

            ### 📥 التحميل
            **TK-Downloader-${{ github.ref_name }}.zip**

            ### 🚀 التشغيل
            - 🪟 Windows: انقر مرتين على `run.bat`
            - 🐧 Linux/macOS: `./run.sh`

            ### 📖 الوثائق
            [README](https://github.com/kaistm25/TK-Downloader-Pro#readme)
          files: TK-Downloader-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}